workflows:
  interceptx-debug:
    name: InterceptX Debug Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.interceptx"
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your_email@example.com
        notify:
          success: true
          failure: true

  interceptx-release:
    name: InterceptX Signed Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - interceptx_keystore   # reference name you set when uploading the keystore in Codemagic
      vars:
        PACKAGE_NAME: "com.interceptx"
      groups:
        - google_play           # only needed if you plan to publish to Play; safe to remove otherwise
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build signed release
        script: |
          ./gradlew bundleRelease
          # ./gradlew assembleRelease   # use this instead if you want a signed .apk rather than .aab
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your_email@example.com
        notify:
          success: true
          failure: true
